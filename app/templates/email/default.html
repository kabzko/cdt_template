<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Personnel Request Update</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f4f7fa;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .header {
            background: linear-gradient(135deg, #87CEEB 0%, #0047AB 100%);
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            color: white;
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .content {
            padding: 30px 25px;
        }
        .message {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            border-left: 4px solid #0047AB;
        }
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #6c757d;
            border-top: 1px solid #eaeaea;
        }
        .button {
            display: inline-block;
            background: linear-gradient(135deg, #87CEEB 0%, #0047AB 100%);
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            margin-top: 15px;
            transition: opacity 0.3s;
        }
        .button:hover {
            opacity: 0.9;
        }
        @media screen and (max-width: 550px) {
            .container {
                width: 100%;
                margin: 0;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Client Personnel Request Update</h1>
        </div>
        <div class="content">
            <div class="message">
                {{ message }}
            </div>
            <p>If you have any questions about this update, please contact our team.</p>
            <div style="text-align: center;">
                <a href="#" class="button" style="color: #ffffff !important;">View Request Details</a>
            </div>
        </div>
        <div class="footer">
            <p>© 2025 Your Company. All rights reserved.</p>
            <p>This email was sent to you because you submitted a Client Personnel Request.</p>
        </div>
    </div>
</body>
</html>
